<!doctype html>
<html lang="kk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6d3df5">
  <title>Желі жоқ · Esimde</title>
  <link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fafafa; color: #101828;
           font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; padding: 1.5rem; box-sizing: border-box; }
    .card { max-width: 380px; text-align: center; background: #fff; border: 1px solid #e9eaee; border-radius: 16px;
            padding: 2rem 1.5rem; box-shadow: 0 4px 12px rgba(16, 24, 40, .06); }
    img { width: 64px; height: 64px; border-radius: 16px; }
    h1 { font-size: 1.3rem; margin: 1rem 0 .5rem; }
    p { color: #667085; line-height: 1.5; margin: 0 0 1.4rem; }
    button { border: 0; background: #6d3df5; color: #fff; font: inherit; font-weight: 600; padding: .65rem 1.3rem;
             border-radius: 8px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/static/img/icon-192.png" alt="Esimde">
    <h1>Интернет байланысы жоқ</h1>
    <p>Esimde-ні пайдалану үшін желіге қосылыңыз. Байланыс қалпына келгенде бетті жаңартыңыз.</p>
    <button type="button" onclick="location.reload()">Қайта көру</button>
  </div>
</body>
</html>
