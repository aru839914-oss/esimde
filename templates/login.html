{% extends "auth_base.html" %}
{% block title %}Жүйеге кіру{% endblock %}
{% block auth_content %}
<h2 class="auth-title">Жүйеге кіру</h2>
<p class="auth-subtitle">Қайта оралғаныңызға қуаныштымыз! Деректеріңізді енгізіңіз.</p>

{% if error %}
<div class="alert alert-danger d-flex gap-2 align-items-center py-2" role="alert">
  <i class="bi bi-exclamation-circle"></i><span>{{ error }}</span>
</div>
{% endif %}

<form method="post" novalidate>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="mb-3">
    <label class="form-label" for="email">Электрондық пошта</label>
    <div class="input-icon">
      <i class="bi bi-envelope"></i>
      <input type="email" class="form-control" id="email" name="email" value="{{ email }}" placeholder="name@mail.kz" autocomplete="email" required autofocus>
    </div>
  </div>
  <div class="mb-3">
    <label class="form-label" for="password">Құпиясөз</label>
    <div class="input-icon">
      <i class="bi bi-lock"></i>
      <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
      <button type="button" class="pw-toggle" data-toggle-password="password" aria-label="Құпиясөзді көрсету"><i class="bi bi-eye"></i></button>
    </div>
  </div>
  <div class="form-check mb-4">
    <input class="form-check-input" type="checkbox" name="remember" id="remember" value="1">
    <label class="form-check-label" for="remember">Мені есте сақтау</label>
  </div>
  <button type="submit" class="btn btn-primary btn-lg w-100">Кіру</button>
</form>
<p class="auth-switch">Аккаунтыңыз жоқ па? <a href="{{ url_for('auth.register') }}">Тіркелу</a></p>
{% endblock %}
