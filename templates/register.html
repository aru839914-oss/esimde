{% extends "auth_base.html" %}
{% block title %}Тіркелу{% endblock %}
{% block auth_content %}
<h2 class="auth-title">Тіркелу</h2>
<p class="auth-subtitle">Аккаунт ашып, маңызды оқиғаларыңызды жоспарлауды бастаңыз.</p>

<form method="post" novalidate>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="mb-3">
    <label class="form-label" for="name">Аты</label>
    <div class="input-icon">
      <i class="bi bi-person"></i>
      <input type="text" class="form-control {% if errors.name %}is-invalid{% endif %}" id="name" name="name" value="{{ data.name }}" placeholder="Атыңыз" maxlength="80" autocomplete="name" required autofocus>
      <div class="invalid-feedback">{{ errors.name }}</div>
    </div>
  </div>
  <div class="mb-3">
    <label class="form-label" for="email">Электрондық пошта</label>
    <div class="input-icon">
      <i class="bi bi-envelope"></i>
      <input type="email" class="form-control {% if errors.email %}is-invalid{% endif %}" id="email" name="email" value="{{ data.email }}" placeholder="name@mail.kz" autocomplete="email" required>
      <div class="invalid-feedback">{{ errors.email }}</div>
    </div>
  </div>
  <div class="mb-3">
    <label class="form-label" for="password">Құпиясөз</label>
    <div class="input-icon">
      <i class="bi bi-lock"></i>
      <input type="password" class="form-control {% if errors.password %}is-invalid{% endif %}" id="password" name="password" placeholder="Кемінде 6 таңба" autocomplete="new-password" required>
      <button type="button" class="pw-toggle" data-toggle-password="password" aria-label="Құпиясөзді көрсету"><i class="bi bi-eye"></i></button>
      <div class="invalid-feedback">{{ errors.password }}</div>
    </div>
  </div>
  <div class="mb-4">
    <label class="form-label" for="password_confirm">Құпиясөзді қайталау</label>
    <div class="input-icon">
      <i class="bi bi-lock"></i>
      <input type="password" class="form-control {% if errors.password_confirm %}is-invalid{% endif %}" id="password_confirm" name="password_confirm" placeholder="Құпиясөзді қайта енгізіңіз" autocomplete="new-password" required>
      <button type="button" class="pw-toggle" data-toggle-password="password_confirm" aria-label="Құпиясөзді көрсету"><i class="bi bi-eye"></i></button>
      <div class="invalid-feedback">{{ errors.password_confirm }}</div>
    </div>
  </div>
  <button type="submit" class="btn btn-primary btn-lg w-100">Тіркелу</button>
</form>
<p class="auth-switch">Аккаунтыңыз бар ма? <a href="{{ url_for('auth.login') }}">Кіру</a></p>
{% endblock %}
